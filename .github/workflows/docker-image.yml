
name: Build and Push Docker Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - module: note-module
            image: note-service
          - module: auth-module
            image: auth-service
          - module: gateway-module
            image: gateway-service

    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 配置 Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Maven 构建
      - name: Build with Maven
        run: |
          mvn -B -pl ${{ matrix.module }} -am package -DskipTests

      # 4. 将 GitHub 用户名转换为小写
      - name: Prepare image name
        id: image
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # 5. 登录 GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. 构建并推送镜像
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.module }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ steps.image.outputs.owner }}/${{ matrix.image }}:${{ github.sha }}
