name: Build and Push Docker Images

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: self-hosted

    steps:
      # 1. 只拉取一次代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 检查 Java
      - name: Check Java
        run: |
          java -version
          mvn -version

      # 3. 缓存 Maven
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. 登录腾讯云 TCR
      - name: Login to Tencent TCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      # 5. 构建并推送所有模块
      - name: Build and Push Images
        run: |
          modules=("note-module:note-service"
                   "auth-module:auth-service"
                   "gateway-module:gateway-service")

          for item in "${modules[@]}"; do
            module="${item%%:*}"
            image="${item##*:}"

            echo "Building $module..."

            mvn clean package -pl "$module" -am -DskipTests

            docker build \
              -t ccr.ccs.tencentyun.com/project-note/$image:latest \
              -t ccr.ccs.tencentyun.com/project-note/$image:${{ github.sha }} \
              -f "$module/Dockerfile" \
              "$module"

            docker push ccr.ccs.tencentyun.com/project-note/$image:latest
            docker push ccr.ccs.tencentyun.com/project-note/$image:${{ github.sha }}
          done

  deploy:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Trigger Remote Deployment
        run: |
          curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -d '{
              "taskId": "${{ github.run_id }}",
              "action": "deploy",
              "currentAt": "${{ github.run_started_at }}"
            }'