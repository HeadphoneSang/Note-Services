name: Build and Push Docker Images

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: self-hosted

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - module: note-module
            image: note-service 
          - module: auth-module
            image: auth-service
          - module: gateway-module
            image: gateway-service

    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 配置 Java 17
      - name: Check Java
        run: |
          java -version
          javac -version

      # 3. Maven 构建
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. 登录腾讯云 TCR
      - name: Login to Tencent TCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # 5. 构建并推送镜像
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.module }}/
          file: ${{ matrix.module }}/Dockerfile
          push: true
          tags: |
            ccr.ccs.tencentyun.com/project-note/${{ matrix.image }}:latest
            ccr.ccs.tencentyun.com/project-note/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
