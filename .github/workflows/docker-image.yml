name: Build and Push Docker Images
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - module: note-module
            image: note-service 
          - module: auth-module
            image: auth-service
          - module: gateway-module
            image: gateway-service
    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 配置 Java 17
      - name: Check Java
        run: |
          java -version
          javac -version

      # 3. Maven 构建
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. 登录腾讯云 TCR
      - name: Login to Tencent TCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      # 5. Maven 编译打包
      - name: Maven Build
        run: |
          mvn clean package -pl ${{ matrix.module }} -am -DskipTests
      # 6. 构建 Docker 镜像
      - name: Build Docker Image
        run: |
          docker build \
            -t ccr.ccs.tencentyun.com/project-note/${{ matrix.image }}:latest \
            -t ccr.ccs.tencentyun.com/project-note/${{ matrix.image }}:${{ github.sha }} \
            -f ${{ matrix.module }}/Dockerfile \
            ${{ matrix.module }}

      # 7. 推送 Docker 镜像
      - name: Push Docker Image
        run: |
          docker push ccr.ccs.tencentyun.com/project-note/${{ matrix.image }}:latest
          docker push ccr.ccs.tencentyun.com/project-note/${{ matrix.image }}:${{ github.sha }}
  deploy:
    runs-on: self-hosted

    # 等待所有 matrix 构建任务完成
    needs: build

    # 只有构建成功才触发部署
    if: success()

    steps:
      - name: Trigger Remote Deployment
        run: |
          curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -d '{
              "taskId": "${{ github.run_id }}",
              "action": "deploy",
              "currentAt": "${{ github.timestamp }}"
            }'