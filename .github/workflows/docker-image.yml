name: Build and Push Docker Images

on:
  push:
    branches: # 当main分支push的时候触发
      - main

# 允许读取代码和推送 GHCR 镜像
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - module: note-module
            image: note-service
          - module: auth-module
            image: auth-service
          - module: gateway-module
            image: gateway-service

    steps:
      # 1. 拉取 GitHub 仓库代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 配置 Java 17 和 Maven 缓存
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. 构建指定微服务
      - name: Build with Maven
        run: |
          mvn -B -pl ${{ matrix.module }} -am package -DskipTests

      # 4. 登录 GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. 构建并推送 Docker 镜像
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.module }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ steps.image.outputs.owner }}/${{ matrix.image }}:${{ github.sha }}
