spring:
  application:
    name: gateway
  profiles:
    active: ${NACOS_ENV}
  cloud:
    gateway:
      routes:
        - id: note
          uri: lb://note
          predicates:
            - Path=/api/note/**
        - id: auth
          uri: lb://auth
          predicates:
            - Path=/api/auth/**
      default-filters:
        - RewritePath=/api/.*?/(?<segment>.*), /$\{segment}
    nacos:
      server-addr: ${NACOS_ADDR}
      config:
        namespace: ${spring.profiles.active:dev}
        import-check:
          enabled: false
        username: nacos
        password: ${NACOS_PASSWORD}
      discovery:
        username: nacos
        password: ${NACOS_PASSWORD}
logging:
  level:
    com.alibaba.cloud.nacos: DEBUG
    org.template: DEBUG
---
spring:
  config:
    import:
      - nacos:jwt.properties?group=GATEWAY_GROUP
      - nacos:redis-config.properties?group=DEFAULT_GROUP
    activate:
      on-profile: dev
server:
  port: 8080