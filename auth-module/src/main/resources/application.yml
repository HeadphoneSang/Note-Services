spring:
  application:
    name: auth
  profiles:
    active: dev
    # include:
  cloud:
    nacos:
      server-addr: 192.144.229.116:8848
      config:
        namespace: ${spring.profiles.active:dev}
        import-check:
          enabled: false
        username: nacos
        password: ${NACOS_PASSWORD}
      discovery:
        username: nacos
        password: ${NACOS_PASSWORD}
logging:
  level:
    com.alibaba.cloud.nacos: DEBUG
    com.chbcraft.auth: DEBUG
---
spring:
  config:
    import:
      - nacos:datasource.properties?group=DEFAULT_GROUP
      - nacos:redis-config.properties?group=DEFAULT_GROUP
      - nacos:mail.properties?group=DEFAULT_GROUP
      - nacos:jwt.properties?group=GATEWAY_GROUP
    activate:
      on-profile: dev
---
knife4j:
  enable: true
  setting:
    language: zh_cn
## mybatis
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.chcbcraft.dto
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
server:
  port: 8080
