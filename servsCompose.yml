name: note_services
services:
  gateway-service:
    image: gateway-service:latest
    container_name: gateway-service
    ports:
      - "80:8080"
    restart: always
    networks:
      - note-network
  auth-service:
    image: auth-service:latest
    container_name: auth-service
    ports:
      - "8080:8080"
    restart: always
    networks:
      - note-network
  note-service:
    image: note-service:latest
    container_name: note-service
    ports:
      - "8081:8080"
    restart: always
    networks:
      - note-network
networks:
  note-network:
    driver: bridge
