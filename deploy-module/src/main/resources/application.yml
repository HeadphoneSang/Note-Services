spring:
  application:
    name: deploy
  profiles:
    active: dev
  cloud:
    nacos:
      server-addr: 192.144.229.116:8848
      config:
        namespace: ${spring.profiles.active:dev}
        import-check:
          enabled: false
        username: nacos
        password: ${NACOS_PASSWORD}
      discovery:
        username: nacos
        password: ${NACOS_PASSWORD}
  config:
    import:
      - nacos:deploy.properties?group=DEPLOY_GROUP
      - nacos:datasource.properties?group=DEFAULT_GROUP
logging:
  level:
    com.alibaba.cloud.nacos: DEBUG
    org.template: INFO
server:
  port: 25565
