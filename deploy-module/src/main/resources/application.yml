spring:
  application:
    name: deploy
  profiles:
    active: ${NACOS_ENV}
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR}
      config:
        namespace: ${spring.profiles.active:dev}
        import-check:
          enabled: false
        username: nacos
        password: ${NACOS_PASSWORD}
  config:
    import:
      - nacos:deploy.properties?group=DEPLOY_GROUP
      - nacos:datasource.properties?group=DEFAULT_GROUP
logging:
  level:
    com.alibaba.cloud.nacos: INFO
    org.template: INFO
server:
  port: 25565
